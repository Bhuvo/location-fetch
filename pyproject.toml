[project]
name = "iptrace"
version = "1.0.0"
description = "Advanced IP Geolocation & Visitor Analytics Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-WTF>=1.2.1",
    "Flask-Limiter>=3.5.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "user-agents>=2.2.0",
    "werkzeug>=3.0.0",
]

[tool.vercel]
entrypoint = "run:app"
